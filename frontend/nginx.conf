server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Résolution DNS dynamique de l'API : sans elle, nginx garde l'adresse IP de `api` obtenue au
    # démarrage et renvoie des 502 dès que le conteneur API est recréé (rebuild, mise à jour).
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream http://api:8000;

    # Téléversement du corpus RAG : jusqu'à 50 fichiers de 50 Mo (RAG_MAX_FILES_PER_UPLOAD × RAG_MAX_FILE_SIZE).
    location = /api/admin/rag/documents {
        client_max_body_size 2560m;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        client_body_timeout 900s;
    }

    location /api/ {
        # Pièces jointes de tickets : 5 fichiers de 10 Mo (MAX_ATTACHMENTS_PER_UPLOAD × MAX_ATTACHMENT_SIZE).
        client_max_body_size 60m;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Les délais IA configurables peuvent atteindre 1800 s; l'analyse tourne en tâche de fond,
        # mais on évite qu'une requête lente soit coupée par le proxy (60 s par défaut).
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
